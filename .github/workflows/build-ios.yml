name: iOS Build

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    name: Build Whatsgram iOS
    # iOS build wajib menggunakan runner macOS
    runs-on: macos-14 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # Penting untuk menarik submodule Telegram

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2' # Sesuaikan dengan versi Xcode yang dibutuhkan

      - name: Cache Build Data
        uses: actions/cache@v3
        with:
          path: |
            ~/.bazel
            ~/Library/Caches/bazel
            build-system/artifacts
          key: ${{ runner.os }}-bazel-${{ hashFiles('**/BUILD', '**/*.bzl', 'WORKSPACE') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Generate Project
        run: |
          python3 build-system/Make/Make.py generateProject --configurationPath build-system/template_minimal_development_configuration.json --disableProvisioningProfiles --xcodeManagedCodesigning

      - name: Build Application
        run: |
          # Perintah ini mungkin berbeda tergantung dari build system spesifik Whatsgram. 
          # Umumnya untuk Telegram-iOS menggunakan xcodebuild atau bazel:
          xcodebuild build \
            -workspace Telegram-iOS.xcworkspace \
            -scheme Telegram-iOS \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
